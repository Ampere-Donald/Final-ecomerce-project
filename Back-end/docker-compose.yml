version: '3.9'
services:
  db:
    image: postgres:16-alpine
    container_name: newoteg_db_new
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-ecommerce}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  app:
    build: .
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASS:-password}@db:5432/${DB_NAME:-ecommerce}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma migrate deploy && npm run start:prod"

volumes:
  postgres_data_v2:
