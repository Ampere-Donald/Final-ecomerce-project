name: Catalogue runtime contract
on:
  pull_request:
    branches: [main]
    paths: ['Font-end/**', 'Back-end/**', 'Dockerfile.catalogue', '.github/workflows/catalogue-runtime.yml']
  push:
    branches: [main]
    paths: ['Font-end/**', 'Back-end/**', 'Dockerfile.catalogue', '.github/workflows/catalogue-runtime.yml']
permissions:
  contents: read
jobs:
  catalogue-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-url: ['/api', 'https://api.newoteg.com']
    env:
      VITE_API_URL: ${{ matrix.api-url }}
      VITE_CATALOGUE_SSR_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Font-end/package-lock.json
            Back-end/package-lock.json
      - run: npm ci --prefix Font-end
      - run: npm ci --prefix Back-end
      - run: npm run build --prefix Font-end
      - run: npm run build:catalogue-package --prefix Font-end
      - run: npm run build --prefix Back-end
      - name: Verify compiled package and frontend version handshake
        run: node Font-end/tests/verify-catalogue-package.cjs
      - name: Build the actual Railway candidate image
        run: docker build --progress plain --build-arg VITE_API_URL="$VITE_API_URL" -t newoteg-catalogue-contract -f Dockerfile.catalogue .
      - name: Verify image runtime without network or database
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -v "$PWD/Font-end/.catalogue-backend/manifest.json:/client-manifest.json:ro" \
            -v "$PWD/Back-end/scripts/verify-catalogue-image.cjs:/verification.cjs:ro" \
            --entrypoint node newoteg-catalogue-contract /verification.cjs /client-manifest.json
