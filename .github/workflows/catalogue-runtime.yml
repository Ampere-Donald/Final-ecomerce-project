name: Catalogue runtime contract
on:
  pull_request:
    branches: [main]
    paths: ['Font-end/**', 'Back-end/**', 'Dockerfile.catalogue', '.github/workflows/catalogue-runtime.yml']
  push:
    branches: [main]
    paths: ['Font-end/**', 'Back-end/**', 'Dockerfile.catalogue', '.github/workflows/catalogue-runtime.yml']
permissions:
  contents: read
jobs:
  catalogue-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-url: /api
            effective-api: /api
            profile: standard
          - api-url: https://api.newoteg.com
            effective-api: https://api.newoteg.com
            profile: standard
          - api-url: https://api.newoteg.com
            effective-api: /api
            profile: cloudflare-production
    env:
      VITE_API_URL: ${{ matrix.api-url }}
      VITE_CATALOGUE_SSR_BUILD: 'true'
      WORKERS_CI: ${{ matrix.profile == 'cloudflare-production' && '1' || '0' }}
      WORKERS_CI_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Font-end/package-lock.json
            Back-end/package-lock.json
      - run: npm ci --prefix Font-end
      - run: npm ci --prefix Back-end
      - run: npm run build --prefix Font-end
      - name: Verify emitted editorial pages and draft isolation
        run: node Font-end/tests/verify-editorial-build.mjs
      - run: npm run build:catalogue-package --prefix Font-end
      - run: npm run build --prefix Back-end
      - name: Verify compiled package and frontend version handshake
        run: node Font-end/tests/verify-catalogue-package.cjs
      - name: Build the actual Railway candidate image
        run: docker build --progress plain --build-arg VITE_API_URL="${{ matrix.effective-api }}" -t newoteg-catalogue-contract -f Dockerfile.catalogue .
      - name: Verify image runtime without network or database
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -v "$PWD/Font-end/.catalogue-backend/manifest.json:/client-manifest.json:ro" \
            -v "$PWD/Back-end/scripts/verify-catalogue-image.cjs:/verification.cjs:ro" \
            --entrypoint node newoteg-catalogue-contract /verification.cjs /client-manifest.json
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -v "$PWD/Back-end/scripts/verify-release-image.cjs:/verification.cjs:ro" \
            --entrypoint node newoteg-catalogue-contract /verification.cjs

  preproduction-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the isolated preproduction image
        run: docker build --progress plain -t newoteg-preproduction-contract -f Back-end/Dockerfile.preproduction Back-end
      - name: Load packaged startup guards without network or database
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -v "$PWD/Back-end/scripts/verify-release-image.cjs:/verification.cjs:ro" \
            --entrypoint node newoteg-preproduction-contract /verification.cjs
