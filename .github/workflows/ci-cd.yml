name: Newoteg CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Back-end/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm audit --omit=dev --audit-level=high

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Font-end-admin/NEWOTEG-ECOMMERCE-feature-new-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Font-end-admin/NEWOTEG-ECOMMERCE-feature-new-dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:offline
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Font-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Font-end/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Font-end-admin/NEWOTEG-ECOMMERCE-feature-new-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Font-end-admin/NEWOTEG-ECOMMERCE-feature-new-dashboard/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./android/gradlew -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: newoteg-admin-debug-apk
          path: Font-end-admin/NEWOTEG-ECOMMERCE-feature-new-dashboard/android/app/build/outputs/apk/debug/app-debug.apk
