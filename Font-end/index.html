<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Discover the home hero before the React/lazy-route waterfall; no other route downloads it. -->
  <script>
    if (window.location.pathname === '/') {
      var heroPreload = document.createElement('link');
      heroPreload.rel = 'preload';
      heroPreload.as = 'image';
      heroPreload.href = '/design-e/multimetre.webp';
      heroPreload.setAttribute('fetchpriority', 'high');
      document.head.appendChild(heroPreload);
    }
  </script>

  <!-- Fallback metadata is handed to the single React owner at startup. -->
  <meta data-newoteg-fallback name="description"
    content="Composants, câbles, alimentation et outillage à Douala. X-Electronic, la boutique électronique de NEWOTEG." />
  <meta name="author" content="X-Electronic / NEWOTEG" />
  <!-- The route metadata provider owns robots directives; the worker protects private documents before JS. -->
  <meta name="theme-color" content="#2A2FCE" />

  <!-- Open Graph -->
  <meta data-newoteg-fallback property="og:type" content="website" />
  <meta data-newoteg-fallback property="og:site_name" content="X-Electronic / NEWOTEG" />
  <meta data-newoteg-fallback property="og:locale" content="fr_CM" />
  <meta data-newoteg-fallback property="og:title" content="X-Electronic — La boutique électronique de NEWOTEG" />
  <meta data-newoteg-fallback property="og:description"
    content="Composants, câbles, alimentation et outillage à Douala. X-Electronic, la boutique électronique de NEWOTEG." />
  <meta data-newoteg-fallback property="og:image" content="https://newoteg.com/logo.png" />

  <!-- Twitter Card -->
  <meta data-newoteg-fallback name="twitter:card" content="summary" />
  <meta data-newoteg-fallback name="twitter:title" content="X-Electronic — La boutique électronique de NEWOTEG" />
  <meta data-newoteg-fallback name="twitter:description"
    content="Composants, câbles, alimentation et outillage à Douala. X-Electronic, la boutique électronique de NEWOTEG." />

  <title data-newoteg-fallback>X-Electronic — La boutique électronique de NEWOTEG</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
